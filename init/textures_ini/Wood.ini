## Common configuration section
[General]

# Information label
labelInfo = Wood_OCC

# Base path to save the model and its results
modelBasePath = ./data/Wood_OCC

# Save results to NPZ files?
npzSave = False

# Image dimensions
imHeight = 256
imWidth = 256
imChannel = 3

# Indices of the test images to plot
imIndxList = 0, 1, 2, 3


## Training configuration section
[Training]

# Selected model from ModelSaved module
; layerSel = ConvM1
modelSel = VQVAE1
layerSel = ConvM1, ConvM2, ConvM3, ConvM4, ConvM5, ConvM6
;modelSel = BAE1, BAE2, VAE1, VAE2, VQVAE1
;layerSel = ConvM2
#ConvM2, ConvM3, ConvM4, ConvM5, ConvM6


# Path to training dataset
datasetPath = texture_images/wood_folders/

# Batch size
batchSize = 20

# Number of epochs
numEpoch = 200

## Prediction with a trained model configuration section
[Prediction]

# Path to prediction data
predictionDataPath = texture_images/wood_folders/test/
predictionResultPath = texture_images/wood_folders/Output/


# Optimal combination of model, layer, feature extractor and anomaly detection algorithm
modelName = BAE1
layerName = ConvM1
featureExtractorName = HardNet1
anomalyAlgorithmName = Local Outlier Factor

# How many images to run through the AE model in one iteration
batchSize = 100